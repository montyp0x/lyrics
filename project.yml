name: Lyrics
options:
  bundleIdPrefix: com.ramych
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: YGT2F4663J
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Lyrics:
    type: application
    platform: iOS
    sources:
      - Lyrics
      - Shared
    dependencies:
      - target: LyricsWidgets
    info:
      path: Lyrics/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Lyrics keeps a coarse location session open so iOS lets it update lyrics on the Lock Screen while it runs in the background. Your location isn't used or stored.
        NSAppleMusicUsageDescription: Lyrics reads what's playing in Apple Music to show synced lyrics.
        CFBundleURLTypes:
          - CFBundleURLName: com.ramych.lyrics
            CFBundleURLSchemes: [lyrics-app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics
        CODE_SIGN_ENTITLEMENTS: Lyrics/Lyrics.entitlements
  LyricsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LyricsWidgets
      - Shared
    info:
      path: LyricsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics.widgets
        CODE_SIGN_ENTITLEMENTS: LyricsWidgets/LyricsWidgets.entitlements
  LyricsMac:
    type: application
    platform: macOS
    sources:
      - Lyrics
      - path: Shared
        excludes:
          - LyricsActivityAttributes.swift
    info:
      path: LyricsMac/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        LSApplicationCategoryType: public.app-category.music
        NSAppleMusicUsageDescription: Lyrics reads what's playing in Apple Music to show synced lyrics.
        NSAppleEventsUsageDescription: Lyrics reads the current song from the Music and Spotify apps so it can show synced lyrics.
        CFBundleURLTypes:
          - CFBundleURLName: com.ramych.lyrics.mac
            CFBundleURLSchemes: [lyrics-app]
    settings:
      base:
        PRODUCT_NAME: Lyrics
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: LyricsMac/LyricsMac.entitlements
    dependencies:
      - target: LyricsMacWidgets
        embed: true
  LyricsMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - LyricsMacWidgets
      - path: Shared
        excludes:
          - LyricsActivityAttributes.swift
    info:
      path: LyricsMacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        NSAppleEventsUsageDescription: Lyrics pauses, goes back, and skips in the Music and Spotify apps.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics.mac.widgets
        CODE_SIGN_ENTITLEMENTS: LyricsMacWidgets/LyricsMacWidgets.entitlements