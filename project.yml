name: Lyrics
options:
  bundleIdPrefix: com.ramych
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Lyrics:
    type: application
    platform: iOS
    sources:
      - Lyrics
      - Shared
    dependencies:
      - target: LyricsWidgets
    info:
      path: Lyrics/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        NSAppleMusicUsageDescription: Lyrics reads what's playing in Apple Music to show synced lyrics.
        CFBundleURLTypes:
          - CFBundleURLName: com.ramych.lyrics
            CFBundleURLSchemes: [lyrics-app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics
  LyricsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - LyricsWidgets
      - Shared
    info:
      path: LyricsWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lyrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramych.lyrics.widgets
